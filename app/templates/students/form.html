{% extends "base.html" %}
{% block title %}{{ 'Изменить студента' if student else 'Новый студент' }} · StudGrade{% endblock %}
{% block content %}
<h3 class="mb-4">{{ 'Изменить данные студента' if student else 'Добавить студента' }}</h3>

<form method="post" class="col-md-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Фамилия</label>
    <input type="text" class="form-control" name="last_name" value="{{ student.last_name if student else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Имя</label>
    <input type="text" class="form-control" name="first_name" value="{{ student.first_name if student else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Отчество</label>
    <input type="text" class="form-control" name="patronymic" value="{{ student.patronymic if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Год поступления</label>
    <input type="number" class="form-control" name="admission_year" min="2000" max="2100"
           value="{{ student.admission_year if student else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Форма обучения</label>
    <select class="form-select" name="study_form" required>
      {% for form in study_forms %}
      <option value="{{ form }}" {% if student and student.study_form == form %}selected{% endif %}>{{ form }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Группа</label>
    <input type="text" class="form-control" name="group_name" value="{{ student.group_name if student else '' }}" required>
  </div>
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a href="{{ url_for('main.students_list') }}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
