{% extends "base.html" %}
{% block title %}Отчёт по форме обучения · StudGrade{% endblock %}
{% block content %}
<h3 class="mb-4">Количество студентов по форме обучения</h3>

<form method="post" class="col-md-4 mb-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Форма обучения</label>
    <select class="form-select" name="study_form" required>
      {% for form in study_forms %}
      <option value="{{ form }}" {% if selected == form %}selected{% endif %}>{{ form }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Рассчитать</button>
</form>

{% if count is not none %}
<div class="alert alert-info col-md-4">
  Форма обучения «{{ selected }}»: <strong>{{ count }}</strong> студент(ов).
</div>
{% endif %}
{% endblock %}
