name: nexora-lr2

services:
  db:
    image: postgres:16
    container_name: nexora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nexora_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql://nexora:nexora@db:5432/nexora
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs

volumes:
  db_data:
  app_logs:
