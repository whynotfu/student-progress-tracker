# Reverse-proxy с TLS-терминацией перед gunicorn (требование п. 4.3.3 ТЗ —
# взаимодействие клиента и сервера должно идти по HTTPS, TLS не ниже 1.2).
#
# Установка сертификата (самоподписанный — для учебного стенда; на
# реальном домене используйте certbot/Let's Encrypt):
#
#   sudo mkdir -p /etc/ssl/studgrade
#   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/ssl/studgrade/studgrade.key \
#     -out /etc/ssl/studgrade/studgrade.crt \
#     -subj "/CN=studgrade.local"
#
#   sudo cp deploy/nginx-studgrade.conf /etc/nginx/sites-available/studgrade
#   sudo ln -s /etc/nginx/sites-available/studgrade /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name studgrade.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name studgrade.local;

    ssl_certificate     /etc/ssl/studgrade/studgrade.crt;
    ssl_certificate_key /etc/ssl/studgrade/studgrade.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
